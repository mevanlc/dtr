name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --locked --example dtr-trampoline
      - run: cargo nextest run --locked
      - name: Exercise real Cargo self-installation
        run: cargo nextest run --locked --run-ignored only -E 'test(real_cargo_repeated_self_install)'
      - run: cargo check --locked
