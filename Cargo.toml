[package]
name = "dtr"
version = "0.1.0"
edition = "2024"
description = "Do The Repo repo"

[dependencies]
base64 = "0.23"
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.9"
ctrlc = "3"
home = "0.5.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
