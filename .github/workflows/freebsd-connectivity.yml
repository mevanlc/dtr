name: FreeBSD connectivity

on:
  workflow_dispatch:
    inputs:
      ssh_user:
        description: SSH login (ignored when the host secret includes user@host)
        type: string
        default: mevanlc
      ssh_port:
        description: SSH port
        type: string
        default: '22'

permissions:
  contents: read

concurrency:
  group: freebsd-connectivity
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify SSH and rsync round trip
        env:
          CFARM_FBSD15_HOST: ${{ secrets.CFARM_FBSD15_HOST }}
          CFARM_FBSD15_KEY: ${{ secrets.CFARM_FBSD15_KEY }}
          CFARM_FBSD15_SSH_USER: ${{ inputs.ssh_user }}
          CFARM_FBSD15_SSH_PORT: ${{ inputs.ssh_port }}
        run: bash scripts/cfarm-freebsd.sh probe
