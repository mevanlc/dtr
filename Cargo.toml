[package]
name = "dtr"
version = "0.1.0"
edition = "2024"
description = "Do The Repo repo"

# Internal trampoline, built explicitly. An example target keeps it out of
# ordinary `cargo install`, including while the helper itself is running.
[[example]]
name = "dtr-trampoline"
path = "src/trampoline.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.9"
ctrlc = "3"
home = "0.5.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
url = "2.5.8"
